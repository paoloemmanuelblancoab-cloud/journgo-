<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f5c">
<title>JourKnows Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette: navy, white, black. Everything else is a tint of those three. */
:root{--ink:#050813;--navy:#0a2260;--blue:#1f48a8;--mid:#6f8fe6;--pale:#c9d4f5;--soft:#eef1fa;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#02040b;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.display{font-family:"Fredoka",ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif;letter-spacing:.2px}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* chunky cartoon buttons */
.cbtn{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);font-weight:700;padding:11px 18px;font-size:16px;transition:transform .08s,box-shadow .08s}
.cbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.cbtn.navy{background:var(--navy);color:#fff}
.cbtn.round{width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;display:grid;place-items:center}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
.chip{background:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);padding:5px 14px;font-weight:700;font-size:15px;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center}
#hScore{font-family:"Fredoka",system-ui,sans-serif;font-size:20px;min-width:70px;justify-content:center}
.hsp{flex:1}
#hHearts{gap:2px;color:var(--navy);font-size:20px;letter-spacing:1px}
#hHearts .lost{opacity:.18}
#hHearts:empty{display:none}
#prompt{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(580px,calc(100% - 24px));background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:10px 16px 12px;z-index:9;text-align:center;pointer-events:none}
#prompt small{display:block;font-size:11.5px;letter-spacing:.8px;font-weight:700;color:var(--blue);text-transform:uppercase}
#prompt b{display:block;font-family:"Fredoka",system-ui,sans-serif;font-size:clamp(17px,4.4vw,23px);line-height:1.2;margin-top:2px}
#prompt span{display:block;font-size:12.5px;color:#47527a;margin-top:3px;line-height:1.35}
#prompt span:empty{display:none}
#prompt.bump{animation:bump .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes bump{from{transform:translateX(-50%) scale(.85)}}
#learn{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:var(--navy);color:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:12px 16px;z-index:9;font-size:14.5px;line-height:1.45;pointer-events:none;animation:rise .3s cubic-bezier(.2,1.4,.4,1)}
#learn b{font-family:"Fredoka",system-ui,sans-serif;font-size:17px;display:block;margin-bottom:2px}
@keyframes rise{from{transform:translate(-50%,30px);opacity:0}}
#pops{position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:30px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);animation:floatUp .9s ease-out forwards;white-space:nowrap}
.pop.bad{color:var(--pale)}
@keyframes floatUp{to{transform:translate(-50%,-130px) scale(1.25);opacity:0}}

/* hub */
#hub{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;pointer-events:none;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
#hub>*{pointer-events:auto}
#hub .spacer{flex:1;min-height:150px;pointer-events:none}
#hub header{text-align:center;color:#fff}
#hub h1{margin:0;font-size:clamp(44px,12vw,78px);line-height:.92;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
#hub h1 span{color:var(--pale)}
#hub header p{margin:10px auto 0;max-width:36ch;font-weight:600;font-size:15px;line-height:1.4;text-shadow:0 2px 0 var(--ink)}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:900px;width:100%;margin:0 auto 12px}
.gcard{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:center;transition:transform .1s,box-shadow .1s}
.gcard:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--ink)}
.gcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.gcard img{width:64px;height:64px;flex:none;border-radius:50%;background:var(--soft);border:3px solid var(--ink)}
.gcard h3{margin:0;font-size:21px;line-height:1}
.gcard p{margin:4px 0 0;font-size:12.5px;color:#47527a;line-height:1.35}
.gcard small{display:block;margin-top:5px;font-weight:700;color:var(--blue);font-size:12px}
.pick{max-width:900px;width:100%;margin:0 auto;color:#fff}
.pick b{font-size:12px;letter-spacing:.8px;text-transform:uppercase;text-shadow:0 2px 0 var(--ink);display:block;margin:0 0 6px 4px}
.pickRow{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px;scrollbar-width:none}
.pickRow::-webkit-scrollbar{display:none}
.pickRow button{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:0;overflow:hidden}
.pickRow button img{width:100%;height:100%;display:block}
.pickRow button[aria-pressed="true"]{background:var(--mid);transform:translateY(-3px) scale(1.1);box-shadow:0 7px 0 var(--ink)}
.foot{max-width:60ch;margin:6px auto 0;text-align:center;color:#c9d4f5;font-size:12px;line-height:1.5}
@media(max-width:720px){.games{grid-template-columns:1fr 1fr;gap:9px}.gcard{flex-direction:column;text-align:center;padding:10px 8px;gap:6px}.gcard img{width:46px;height:46px}.gcard h3{font-size:17px}.gcard p{display:none}.gcard small{margin-top:2px}#hub .spacer{min-height:60px}}

/* modal */
#modal{position:fixed;inset:0;z-index:30;background:rgba(2,4,11,.72);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
#mCard{background:#fff;border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:22px 20px 20px;width:min(440px,100%);max-height:90vh;overflow:auto;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#mCard h2{margin:0 0 6px;font-size:30px;line-height:1.05}
#mCard p{margin:6px 0;line-height:1.5}
#mCard .how{text-align:left;background:var(--soft);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:14.5px;line-height:1.5;margin:12px 0 16px}
#mCard .how li{margin:3px 0}
#mCard .how ul{margin:0;padding-left:18px}
#mCard .btns{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.stars{font-size:40px;letter-spacing:4px;color:var(--navy);-webkit-text-stroke:2px var(--ink);line-height:1}
.stars .off{color:#fff}
.big{font-family:"Fredoka",system-ui,sans-serif;font-size:54px;line-height:1;margin:6px 0 0!important}
.slist{text-align:left;margin:14px 0 4px;display:flex;flex-direction:column;gap:8px}
.slist h4{margin:0 0 2px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:#47527a}
.stItem{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--soft);border:2px solid var(--ink);border-radius:14px;padding:8px 10px}
.stItem img{width:38px;height:38px;flex:none;border-radius:50%;background:#fff}
.stItem span{flex:1;min-width:0;line-height:1.25}
.stItem b{font-size:13.5px;display:block}
.stItem small{font-size:11.5px;color:#47527a}
.stItem i{font-style:normal;font-weight:700}
.disc{color:#47527a;font-size:11.5px;line-height:1.45;margin:10px 0 0!important}

@media (prefers-reduced-motion: reduce){#prompt.bump,#learn,#mCard,.pop{animation:none}.gcard{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="3D game view"></canvas>

<main id="hub">
  <header>
    <h1 class="display">JourKnows<br><span>Arcade</span></h1>
    <p>Six 3D minigames powered by this month's real Philippine stories. Tap a Journ to say hi.</p>
  </header>
  <div class="spacer"></div>
  <section class="games" id="games" aria-label="Minigames"></section>
  <section class="pick"><b>Your Journ</b><div class="pickRow" id="pickRow" role="group" aria-label="Choose your Journ"></div></section>
  <p class="foot" id="foot"></p>
</main>

<div id="hud" hidden>
  <button class="cbtn round" id="hBack" aria-label="Back to arcade">←</button>
  <div class="chip" id="hScore">0</div>
  <div class="chip" id="hMid"></div>
  <div class="hsp"></div>
  <div class="chip" id="hHearts" aria-label="Lives"></div>
  <button class="cbtn round" id="hMute" aria-label="Toggle sound">♪</button>
</div>
<div id="prompt" role="status" hidden><small id="pTag"></small><b id="pText"></b><span id="pSub"></span></div>
<div id="learn" role="status" hidden></div>
<div id="pops"></div>
<div id="modal" hidden><div id="mCard" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ease=k=>1-Math.pow(1-k,3);
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

if(!window.THREE){
  document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:24px;font-family:system-ui">The 3D engine could not load. Check your connection and reload.</div>');
  return;
}

/* ---------- save ---------- */
const KEY='jourknows-arcade-v1';
let S={best:{dash:0,match:0,whack:0,stack:0,pop:0,flap:0},pick:1,mute:false};
try{const raw=JSON.parse(localStorage.getItem(KEY)||'{}');S=Object.assign(S,raw);S.best=Object.assign({dash:0,match:0,whack:0,stack:0,pop:0,flap:0},raw.best||{});}catch(e){}
const saveS=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

/* ---------- sound ---------- */
let AC=null;
function sfx(f,type='sine',d=.12,v=.12,to){
  if(S.mute)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,n);
    if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);
    g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d+.02);
  }catch(e){}
}
const SND={
  ok:()=>{sfx(520,'triangle',.1,.14,780);setTimeout(()=>sfx(780,'triangle',.16,.12,1040),90);},
  bad:()=>sfx(240,'sawtooth',.26,.09,110),
  flip:()=>sfx(420,'sine',.09,.1,640),
  coin:()=>sfx(900,'square',.07,.04,1300),
  pop:()=>sfx(300,'sine',.14,.12,760),
  hit:()=>sfx(170,'square',.13,.12,70),
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>sfx(f,'triangle',.2,.12),i*110));}
};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};

/* ---------- species ---------- */
const SP=[
 {id:0,name:'Leafling',type:'Agriculture',c:'#12307a',c2:'#e8edff',kind:'leaf'},
 {id:1,name:'Embit',type:'Economy',c:'#0a1030',c2:'#c9d4f5',kind:'flame'},
 {id:2,name:'Puddlo',type:'Water',c:'#1f48a8',c2:'#ffffff',kind:'drop'},
 {id:3,name:'Zapnub',type:'Energy',c:'#f4f6ff',c2:'#c9d4f5',kind:'bolt'},
 {id:4,name:'Pebblit',type:'Budget',c:'#5a6ca8',c2:'#dfe6fa',kind:'rock'},
 {id:5,name:'Fluffum',type:'Environment',c:'#c9d4f5',c2:'#ffffff',kind:'cloud'},
 {id:6,name:'Glimmoth',type:'Public Opinion',c:'#2a4fae',c2:'#d6e0ff',kind:'moth'},
 {id:7,name:'Boolet',type:'Accountability',c:'#0d2566',c2:'#aebce8',kind:'ghost'},
 {id:8,name:'Frostik',type:'Sea Dispute',c:'#a9bdf0',c2:'#f4f6ff',kind:'ice'},
 {id:9,name:'Dreamoo',type:'Online Safety',c:'#e6ebfb',c2:'#ffffff',kind:'moon'},
 {id:10,name:'Lunaraw',type:'Security',c:'#050813',c2:'#5a7bd0',kind:'wolf',eye:'#4f74d6'},
 {id:11,name:'Solarix',type:'Politics',c:'#0b2a6f',c2:'#f4f6ff',kind:'sun'}
];

/* ---------- stories (October 2026 edition, as of Oct. 14, 2026) ---------- */
const EDITION={label:'October 2026',asOf:'Oct. 14, 2026'};
const STORY_DATA={
 Solarix:{title:'Impeachment trial narrows to one article',stat:'1 of 4',label:'articles of impeachment reported still standing against VP Sara Duterte as of Oct. 14',claim:'As of Oct. 14, the Senate impeachment court is still hearing all four original articles.',ans:false,why:'Reports say the court approved dropping three of the four, leaving the unexplained wealth article.',src:{name:'Daily Tribune: prosecutors to rest case (Oct. 9)',url:'https://tribune.net.ph/2026/10/09/house-prosecution-panel-to-rest-vp-sara-impeachment-case-on-article-ii'}},
 Zapnub:{title:'Meralco told to refund P2.64 billion',stat:'P2.64B',label:'net refund ordered by the Energy Regulatory Commission',claim:'The Meralco refund order is final and cannot change.',ans:false,why:'The ERC called it provisional, with hearings scheduled for Oct. 16 to 23.',src:{name:'GMA News: ERC tells Meralco to refund',url:'https://www.gmanetwork.com/news/money/companies/1005587/erc-tells-meralco-to-refund-p2-64-billion-to-customers/story/'}},
 Fluffum:{title:'Haze keeps air quality in the red',stat:'AQI 215',label:"Metro Cebu reading on Sept. 2, in the 'acutely unhealthy' range (DENR-EMB 7)",claim:'DENR-EMB said the haze was possibly linked to fires in Kalimantan, Indonesia.',ans:true,why:'That is what the bureau said in its advisory, citing transboundary haze carried by prevailing winds.',src:{name:'Philstar: toxic haze halts classes (Sept. 3)',url:'https://www.philstar.com/nation/2026/09/03/2553765/toxic-haze-halts-classes'}},
 Dreamoo:{title:'House votes to bar kids under 13 from social media',stat:'Under 13',label:'age covered by the House-approved ban (Oct. 12)',claim:'The House and Senate versions of the bill set the same age limit.',ans:false,why:"The House version covers under 13. The Senate's is stricter and bars anyone under 18 from creating accounts.",src:{name:'Reuters via The Star: lower house approves bill',url:'https://www.thestar.com.my/aseanplus/aseanplus-news/2026/10/12/philippine-lower-house-approves-bill-restricting-minors039-social-media-access'}},
 Frostik:{title:'Water cannon delays a medical evacuation at Ayungin Shoal',stat:'~10 hrs',label:'delay the Philippine Coast Guard reported on the Oct. 8 evacuation',claim:'The water cannon stream hit the BRP Cabra during the Oct. 8 evacuation.',ans:false,why:'The Coast Guard said the stream did not hit the ship, though the encounter delayed the mission.',src:{name:'South China Morning Post: Beijing and Manila trade blame',url:'https://scmp.com/news/china/diplomacy/article/3370306/china-and-philippines-blame-each-other-over-south-china-sea-medical-mission'}},
 Embit:{title:'More families say they are poor',stat:'16.8M',label:"families rated themselves poor in SWS's Sept. 21 to 27 survey",claim:'Self-rated poverty fell between June and September 2026.',ans:false,why:'It rose from 49 percent in June to 55 percent in September.',src:{name:'Manila Bulletin: 16.8 million families consider themselves poor',url:'https://mb.com.ph/2026/10/13/168-million-families-consider-themselves-poor-in-q3-2026-sws'}},
 Lunaraw:{title:'A China-remittance claim reaches the impeachment trial',stat:'P319.33M',label:'remittances from China and Hong Kong to Cale88 Foods, per AMLC testimony on Oct. 5',claim:'Reports say wrongdoing over the China-linked remittances has been established.',ans:false,why:'Coverage notes the allegations have drawn scrutiny but wrongdoing has not been established.',src:{name:'Daily Tribune: Duterte hits Marcos over China funding',url:'https://tribune.net.ph/2026/10/12/inday-hits-marcos-over-china-funding-alleges-security-threat'}},
 Puddlo:{title:"Metro Manila's water allocation is cut for El Niño",stat:'44 m³/s',label:'MWSS allocation from October, down from the usual 50 to 53 (NWRB)',claim:"Metro Manila's water allocation was raised starting in October.",ans:false,why:'The NWRB lowered it to 44 cubic meters per second from the usual 50 to 53.',src:{name:'Daily Tribune: government braces for strong El Niño',url:'https://tribune.net.ph/2026/09/30/govt-braces-for-strong-el-ni%C3%B1o'}},
 Leafling:{title:"Farms brace for a 'very strong' El Niño",stat:'P10B',label:'extra El Niño funding the Agriculture department is seeking',claim:'PAGASA said on Sept. 23 that a strong El Niño was already active.',ans:true,why:'It also said the event was expected to intensify into a very strong El Niño during September to December.',src:{name:'Daily Tribune: government braces for strong El Niño',url:'https://tribune.net.ph/2026/09/30/govt-braces-for-strong-el-ni%C3%B1o'}},
 Pebblit:{title:'House passes the P7.2-trillion 2027 budget',stat:'281 to 13',label:'House vote on third reading (one abstention), reported Oct. 12',claim:'The 2027 budget bill is already signed into law.',ans:false,why:'The House passed it on third reading. It still goes through Senate deliberations before enactment.',src:{name:'Daily Tribune: House approves 2027 budget',url:'https://tribune.net.ph/2026/10/12/house-approves-p72-trillion-2027-budget-amid-minority-objections'}},
 Boolet:{title:'Flood control scandal: cases move, questions remain',stat:'P611.4M',label:'returned to the DOJ as of March 2026 in the flood control probe',claim:'PCIJ reports that the 2026 budget enacted after the scandal drastically reduced flood control funding.',ans:true,why:"That is what PCIJ's July 2026 review says, though the House's 2027 budget bill restores P107.4 billion.",src:{name:'PhilSTAR Life: what has happened since the 2025 SONA',url:'https://philstarlife.com/amp/article/609533-what-has-happened-since-marcos-2025-sona'}},
 Glimmoth:{title:"What a trust survey does and doesn't tell us",stat:'56% vs 36%',label:'strong trust in VP Duterte vs. President Marcos, SWS Sept. 21 to 27',claim:'The SWS trust survey interviewed 1,500 adults face to face.',ans:true,why:'The Sept. 21 to 27 survey used face-to-face interviews with 1,500 adults nationwide.',src:{name:'Daily Tribune: SWS trust and satisfaction ratings',url:'https://tribune.net.ph/2026/10/13/dutertes-56-trust-dwarfs-marcos-36-as-presidents-satisfaction-rating-sinks'}}
};
const STORIES=SP.map(sp=>Object.assign({sp},STORY_DATA[sp.name]));
const storyOf=sp=>STORIES[sp.id];
/* story data check: warns in the console if an entry is incomplete */
STORIES.forEach(s=>{const bad=[];['title','stat','label','claim','why'].forEach(k=>{if(!s[k])bad.push(k);});if(typeof s.ans!=='boolean')bad.push('ans');if(!s.src||!/^https:\/\//.test(s.src.url||''))bad.push('src.url');if(bad.length)console.warn('[JourKnows story data]',s.sp.name,'missing or invalid:',bad.join(', '));});

/* ---------- 2D art (used for icons and card faces) ---------- */
function artRaw(s){
  const c=s.c,c2=s.c2,eye=s.eye||'#2a2438';
  let back='',mid='',front='';
  switch(s.kind){
    case 'leaf':
      front=`<path d="M60 42C48 14 26 18 24 30C30 44 48 46 60 42Z" fill="#3fae52"/><path d="M60 42C72 14 94 18 96 30C90 44 72 46 60 42Z" fill="#6bd37c"/><path d="M60 42V24" stroke="#2f8a40" stroke-width="3.5" stroke-linecap="round"/>`;break;
    case 'flame':
      back=`<path d="M92 88C114 84 118 62 108 48C106 66 98 68 88 72Z" fill="#ff9a3c"/><circle cx="108" cy="46" r="6" fill="#ffd23f"/>`;
      front=`<path d="M60 42C44 30 54 18 56 4C72 16 78 32 60 42Z" fill="#ff5a2c"/><path d="M60 42C52 34 58 26 59 18C68 26 68 34 60 42Z" fill="#ffd23f"/>`;break;
    case 'drop':
      back=`<path d="M24 88C8 92 6 104 14 108C20 100 26 96 34 94Z" fill="${c}"/>`;
      front=`<path d="M60 40C52 26 58 14 60 4C62 14 68 26 60 40Z" fill="${c}"/>`;break;
    case 'bolt':
      back=`<polygon points="90,92 110,82 102,74 120,56 94,70 100,78 88,84" fill="#ffb000"/>`;

/* ---------- 3D Journs (cartoon, toon-shaded, inked outlines) ---------- */
function buildJourn(sp){
  const g=new THREE.Group(),b=new THREE.Group();g.add(b);
  const c=sp.c,c2=sp.c2,eye=sp.eye||'#050813',k=sp.kind;
  /* parts behind the body */
  if(k==='moth')for(const s of[-1,1]){const w=sph(c2,s*1.2,1.2,-.35,.95,1.05,.12);w.rotation.y=s*.5;w.rotation.z=-s*.25;b.add(w);}
  if(k==='sun')for(let i=0;i<12;i++){const a=i*Math.PI/6;b.add(cone(i%2?'#1f48a8':'#ffffff',Math.sin(a)*1.55,1+Math.cos(a)*1.55,-.4,.22,.65,0,-a,1.12));}
  if(k==='flame'){b.add(sph('#1f48a8',0,.7,-1.05,.32,.32,.4));b.add(cone('#0b2a6f',0,1.25,-1.05,.2,.55,0,0,1.1));}
  if(k==='drop')b.add(sph(c,0,.55,-1.1,.38,.34,.5));
  if(k==='wolf')b.add(sph(c2,0,.85,-1.25,.34,.34,.62));
  if(k==='bolt')[[0,.9,-.5],[.22,1.4,.5],[-.08,1.9,-.5]].forEach(([x,y,r])=>{const z=mk(BOX,'#0b2a6f',1.12);z.position.set(x,y,-1.1);z.scale.set(.3,.65,.14);z.rotation.z=r;b.add(z);});
  /* body */
  b.add(sph(c,0,1,0,1,.92,.95,1.07));
  if(k==='ghost'){const sk=new THREE.Mesh(new THREE.CylinderGeometry(.92,1.08,.6,22),toon(c));sk.position.y=.34;const sl=new THREE.Mesh(sk.geometry,OUT);sl.scale.setScalar(1.06);sk.add(sl);b.add(sk);}
  b.add(sph(c2,0,.6,.62,.62,.46,.34,0));
  /* face */
  for(const s of[-1,1]){
    b.add(sph('#ffffff',s*.38,1.2,.8,.25,.3,.18,1.1));
    b.add(sph(eye,s*.38,1.18,.94,.13,.16,.1,0));
    b.add(sph('#ffffff',s*.38+.04,1.24,1.02,.045,.045,.03,0));
    b.add(sph('#9db4ee',s*.68,.93,.72,.15,.09,.06,0));
  }
  const mouth=new THREE.Mesh(new THREE.TorusGeometry(.13,.035,8,14,Math.PI),toon('#050813'));mouth.rotation.z=Math.PI;mouth.position.set(0,1.0,.955);b.add(mouth);
  /* limbs */
  for(const s of[-1,1]){
    if(k!=='ghost')b.add(sph(c2,s*.45,.12,.35,.3,.18,.38,1.1));
    b.add(sph(c,s*.98,.85,.12,.2,.26,.2,1.1));
  }
  /* head accessory */
  switch(k){
    case 'leaf':b.add(cyl('#050813',0,1.98,0,.05,.35));for(const s of[-1,1]){const l=sph(s<0?'#1f48a8':'#c9d4f5',s*.4,2.2,0,.5,.12,.26);l.rotation.z=s*.45;b.add(l);}break;
    case 'flame':b.add(cone('#0b2a6f',0,2.45,0,.42,1.05));b.add(cone('#ffffff',0,2.38,.05,.22,.62,0,0,0));break;
    case 'drop':b.add(cone(c,0,2.45,0,.34,.95));break;
    case 'bolt':for(const s of[-1,1]){b.add(cone(c,s*.62,2.1,0,.28,.9,0,-s*.35));b.add(cone('#050813',s*.7,2.55,0,.14,.3,0,-s*.35,0));}break;
    case 'rock':b.add(cone('#3a4a80',-.45,2.05,0,.3,.8,0,.3));b.add(cone('#aab8e6',0,2.25,0,.36,1.1));b.add(cone('#3a4a80',.45,2.05,0,.3,.8,0,-.3));b.add(sph('#2a3a70',.98,.62,.3,.14));break;
    case 'cloud':b.add(sph(c2,-.45,2.0,0,.45));b.add(sph(c2,0,2.28,0,.55));b.add(sph(c2,.45,2.0,0,.45));break;
    case 'moth':for(const s of[-1,1]){const a=cyl('#050813',s*.28,2.15,0,.04,.42);a.rotation.z=-s*.4;b.add(a);b.add(sph('#ffffff',s*.5,2.42,0,.11));}break;
    case 'ghost':b.add(sph(c,0,2.0,0,.2,.26,.2));break;
    case 'ice':b.add(cone('#eef2ff',-.42,2.1,0,.22,.9,0,.3));b.add(cone('#eef2ff',0,2.3,0,.26,1.15));b.add(cone('#eef2ff',.42,2.1,0,.22,.9,0,-.3));break;
    case 'moon':for(const s of[-1,1]){b.add(sph(c,s*.78,1.8,0,.34));b.add(sph(c2,s*.78,1.8,.12,.2,.2,.1,0));}{const t=new THREE.Mesh(new THREE.TorusGeometry(.3,.1,8,20,Math.PI*1.5),toon('#ffffff'));const l=new THREE.Mesh(t.geometry,OUT);l.scale.setScalar(1.18);t.add(l);t.position.set(0,2.3,0);b.add(t);}break;
    case 'wolf':for(const s of[-1,1]){b.add(cone(c,s*.6,2.1,0,.36,.95,0,-s*.3));b.add(cone(c2,s*.6,2.0,.1,.2,.55,0,-s*.3,0));}break;
  }

}

/* ---------- FX + UI ---------- */
class FX{
  constructor(sc){this.sc=sc;this.ps=[];}
  burst(p,n=14,cols=['#ffffff','#a9bdf0','#6f8fe6'],spd=6){
    n=REDUCED?Math.ceil(n/2):n;
    for(let i=0;i<n;i++){
      const m=new THREE.Mesh(TET,toon(pick(cols)));m.scale.setScalar(rnd(.08,.18));m.position.copy(p);this.sc.add(m);
      const a=rnd(0,6.28),u=rnd(.3,1);
      this.ps.push({m,v:new THREE.Vector3(Math.cos(a)*spd*u,rnd(2,spd),Math.sin(a)*spd*u),l:rnd(.5,.9)});
    }
  }
  update(dt){
    for(let i=this.ps.length-1;i>=0;i--){
      const q=this.ps[i];q.l-=dt;q.v.y-=14*dt;q.m.position.addScaledVector(q.v,dt);q.m.rotation.x+=dt*8;q.m.scale.multiplyScalar(Math.max(0,1-dt*1.2));
      if(q.l<=0){this.sc.remove(q.m);this.ps.splice(i,1);}
    }
  }
}

function mkHub(){
  const scene=new THREE.Scene();scene.background=skyTex('#02040b','#14307a');lights(scene);
  const cam=new THREE.PerspectiveCamera(50,1,.1,100);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(10,48),toon('#0a2260'));floor.rotation.x=-Math.PI/2;scene.add(floor);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(10,.25,8,64),toon('#6f8fe6'));rim.rotation.x=Math.PI/2;rim.position.y=.1;scene.add(rim);
  const sp=[];for(let i=0;i<70;i++)sp.push(rnd(-30,30),rnd(4,26),rnd(-30,-6));
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.28})));
  const ring=new THREE.Group();scene.add(ring);
  let R=5,js=[];
  SP.forEach((s,i)=>{const j=cloneJourn(s.id);j.userData={a:i/SP.length*Math.PI*2,hop:0,id:s.id};ring.add(j);js.push(j);});
  const rc=new THREE.Raycaster();
  function layout(){
    const asp=innerWidth/innerHeight;R=clamp(asp*4.2,2.5,6.2);
    const sc=clamp(R/6.2,.5,.9);
    js.forEach(j=>{j.scale.setScalar(sc);j.position.set(Math.sin(j.userData.a)*R,0,Math.cos(j.userData.a)*R);j.rotation.y=j.userData.a;});
    cam.position.set(0,3.6,R+8.5);cam.lookAt(0,1.2,0);
  }
  return{scene,cam,
    resize(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();layout();},
    update(dt,t){
      ring.rotation.y=t*.18;
      js.forEach((j,i)=>{
        if(j.userData.hop>0)j.userData.hop=Math.max(0,j.userData.hop-dt*2.2);
        animJourn(j,t,i*.7,.1);
        j.children[0].position.y+=Math.sin(j.userData.hop*Math.PI)*1.1;
        const sel=j.userData.id===S.pick;j.children[0].rotation.y=sel?Math.sin(t*3)*.25:0;
      });
    },
    pointer(type,x,y){
      if(type!=='down')return;
      rc.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),cam);
      const h=rc.intersectObjects(ring.children,true)[0];if(!h)return;
      let o=h.object;while(o.parent&&o.parent!==ring)o=o.parent;
      if(o.userData&&o.userData.id!=null){o.userData.hop=1;SND.pop();buzz(15);}
    },
    dispose(){}
  };
}

    const pad=new THREE.Mesh(new THREE.PlaneGeometry(W,6),new THREE.MeshBasicMaterial({color:fact?0xeef2ff:0x050813,transparent:true,opacity:.6}));pad.rotation.x=-Math.PI/2;pad.position.set(0,.04,1);g.add(pad);
    return g;
  }
  function mkBarrier(){
    const g=new THREE.Group(),b=mk(BOX,'#050813',1.04);b.scale.set(LANE*.9,1.1,.6);b.position.y=.55;g.add(b);
    const pn=new THREE.Mesh(new THREE.PlaneGeometry(LANE*.8,.8),new THREE.MeshBasicMaterial({map:labelTex('NO!','#ffffff','#050813')}));pn.position.set(0,.6,.31);g.add(pn);

  }
  /* run setup: 4 facts + 6 fictions, shuffled */
  const facts=STORIES.filter(s=>s.ans),fics=STORIES.filter(s=>!s.ans);
  const claims=shuffle([...shuffle(facts).slice(0,3),...shuffle(fics).slice(0,NG-3)]);
  const gates=[],coins=[];
  claims.forEach((cl,i)=>{
    const factLane=Math.random()<.5?-1:1,d=FIRST+i*GAP;
    const gf=mkGate('FACT',true),gx=mkGate('FICTION',false),gb=mkBarrier();
    gf.position.x=factLane*LANE;gx.position.x=-factLane*LANE;
    scene.add(gf,gx,gb);
    gates.push({d,claim:cl,factLane,groups:[gf,gx,gb],done:false});
    const lane=pick([-1,0,1]);
    for(let j=0;j<6;j++){
      const w=new THREE.Group(),disc=mk(CYL,'#ffffff',1.18);disc.scale.set(.34,.07,.34);disc.rotation.x=Math.PI/2;w.add(disc);w.position.y=1.15;
      scene.add(w);coins.push({w,d:d+20+j*4.5,lane,got:false});
    }

  const END=FIRST+(NG-1)*GAP+30;
  /* player */
  const player=cloneJourn(S.pick);player.scale.setScalar(.85);player.rotation.y=Math.PI;scene.add(player);
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(.8,20),new THREE.MeshBasicMaterial({color:0x050813,transparent:true,opacity:.3}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.03;scene.add(shadow);
  const ST={dist:0,lane:0,px:0,hearts:3,score:0,streak:0,correct:0,resolved:0,shake:0,over:false,hop:0};
  let running=false,sx=0,celebrate=0;
  const lane2x=l=>l*LANE;
  function setPrompt(){
    const g=gates.find(x=>!x.done);
    if(g)UI.prompt(`Claim ${gates.indexOf(g)+1} of ${NG} · Fact or fiction?`,g.claim.claim,'Run through the FACT or FICTION gate. Skip the middle.');
  }
  function move(d){if(!running||ST.over)return;const n=clamp(ST.lane+d,-1,1);if(n!==ST.lane){ST.lane=n;sfx(500,'sine',.06,.06,700);}}
  function resolve(g){
    g.done=true;ST.resolved++;
    const L=clamp(Math.round(ST.px/LANE),-1,1);
    const pickedFact=L===g.factLane?true:L===-g.factLane?false:null;
    const ok=pickedFact!==null&&pickedFact===g.claim.ans;
    const [sx2,sy2]=scr(new THREE.Vector3(ST.px,2.6,0),cam);
    if(ok){
      ST.streak++;ST.correct++;const pts=100+Math.min(ST.streak,5)*10;ST.score+=pts;
      fx.burst(new THREE.Vector3(ST.px,1.6,0),22);SND.ok();buzz(25);ST.hop=1;
      UI.pop('+'+pts,sx2,sy2);
    }else{
      ST.hearts--;ST.streak=0;ST.shake=REDUCED?0:.55;SND.bad();buzz([60,40,60]);
      UI.hearts(ST.hearts);UI.pop(pickedFact===null?'Oops!':'Not quite',sx2,sy2,'bad');
    }
    UI.score(ST.score);
    UI.learn(`<b>${ok?'Correct':'Not quite'}: this one is ${g.claim.ans?'a fact':'fiction'}.</b>${esc(g.claim.why)}`,3600);
    if(ST.hearts<=0)end();
    else if(ST.resolved>=NG)setTimeout(end,1500);
    else setPrompt();
  }
  function end(){
    if(ST.over)return;ST.over=true;running=false;celebrate=1;
    const st=ST.correct>=9?3:ST.correct>=6?2:ST.correct>=3?1:0;
    setTimeout(()=>finish('dash',{title:ST.hearts<=0?'Out of hearts!':'Finish line!',score:ST.score,stars:st,line:`${ST.correct} of ${NG} claims right`,stories:claims.slice(0,Math.max(1,ST.resolved))}),900);
  }
  return{scene,cam,
    resize(){
      const asp=innerWidth/innerHeight;cam.aspect=asp;
      cam.fov=asp<1?clamp(2*Math.atan(Math.tan(20.6*Math.PI/180)/asp)*180/Math.PI,58,82):58;
      cam.updateProjectionMatrix();
    },
    start(){running=true;setPrompt();UI.hearts(3);UI.mid('');},
    update(dt,t){
      if(running&&!ST.over){const ng=gates.find(x=>!x.done),gap=ng?ng.d-ST.dist:99,slow=gap<24?.6+.4*clamp((gap-6)/18,0,1):1;ST.dist+=(13+.6*ST.resolved)*slow*dt;}
      const dist=ST.dist;
      ST.px+=(lane2x(ST.lane)-ST.px)*Math.min(1,dt*12);
      /* world */
      for(const d of dashes){d.position.z=6-d.userData.i*9+(dist%9);}
      for(const p of props){let z=-(p.userData.d-dist);if(z>14){p.userData.d+=NP*SPN;z=-(p.userData.d-dist);}p.position.set(p.userData.side*p.userData.off,0,z);}
      for(const g of gates){
        const z=-(g.d-dist);g.groups.forEach(o=>o.position.z=z);g.groups[2].position.x=0;
        if(running&&!g.done&&dist>=g.d-.4)resolve(g);
      }
      for(const c of coins){
        const z=-(c.d-dist);c.w.position.set(lane2x(c.lane),1.15+Math.sin(t*4+c.d)*.12,z);c.w.rotation.y=t*4;c.w.visible=!c.got&&z<14;
        if(running&&!c.got&&Math.abs(z)<.8&&Math.abs(ST.px-lane2x(c.lane))<1){c.got=true;ST.score+=10;UI.score(ST.score);SND.coin();fx.burst(c.w.position.clone(),5,['#ffffff','#a9bdf0'],3);}
      }
      /* player */
      ST.hop=Math.max(0,ST.hop-dt*2);
      animJourn(player,t,0,running?.3:.1,running?11:5);
      player.children[0].position.y+=Math.sin(ST.hop*Math.PI)*1.0;
      player.position.set(ST.px,0,0);
      player.rotation.z=(lane2x(ST.lane)-ST.px)*-.12;
      player.rotation.y=Math.PI+(celebrate?Math.sin(t*6)*.8:0);
      shadow.position.x=ST.px;
      /* camera */
      ST.shake=Math.max(0,ST.shake-dt*1.6);
      const sh=ST.shake*.35;
      cam.position.set(ST.px*.5+rnd(-sh,sh),4.5+rnd(-sh,sh),innerWidth<innerHeight?10:8.4);
      cam.lookAt(ST.px*.3,1.5,-12);
      fx.update(dt);
    },
    pointer(type,x){
      if(type==='down'){sx=x;}
      else if(type==='up'){const dx=x-sx;if(Math.abs(dx)>28)move(dx>0?1:-1);else move(x>innerWidth/2?1:-1);}
    },
    key(e){
      if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')move(-1);
      else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')move(1);
    },
    dispose(){}
  };
}

/* ---------- Game 2: Journ Match (3D memory cards) ---------- */
function mkMatch(){

    ys.push(line);const y0=cy-(ys.length-1)*lh/2;ys.forEach((l,i)=>x.fillText(l,cx,y0+i*lh));
  }
  function faceTex(spec){
    const c=document.createElement('canvas');c.width=320;c.height=440;const x=c.getContext('2d');const tex=new THREE.CanvasTexture(c);tex.anisotropy=4;
    let img=null;
    const draw=()=>{
      x.clearRect(0,0,320,440);

        x.fillStyle='#ffffff';rrect(x,0,0,320,440,34);x.fill();

        x.fillStyle='#eef1fa';x.beginPath();x.arc(160,185,118,0,7);x.fill();x.lineWidth=6;x.stroke();
        if(img&&img.complete)x.drawImage(img,50,75,220,220);
        x.fillStyle='#050813';x.font='700 44px Fredoka,system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(spec.sp.name,160,375);
      }else{
        x.fillStyle='#0a2260';rrect(x,0,0,320,440,34);x.fill();
        x.lineWidth=12;x.strokeStyle='#050813';rrect(x,6,6,308,428,30);x.stroke();
        x.strokeStyle='#6f8fe6';x.lineWidth=4;x.setLineDash([12,10]);rrect(x,26,26,268,388,22);x.stroke();x.setLineDash([]);
        x.fillStyle='#a9bdf0';x.font='700 28px Fredoka,system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('TOPIC',160,80);
        x.fillStyle='#ffffff';x.font='700 56px Fredoka,system-ui,sans-serif';wrap(x,spec.sp.type,160,225,250,64);
      }
      tex.needsUpdate=true;
    };
    if(spec.kind==='j'){img=new Image();img.onload=draw;img.src=uri(spec.sp);}
    draw();spec.redraw=draw;return tex;
  }
  const backTex=(()=>{
    const c=document.createElement('canvas');c.width=320;c.height=440;const x=c.getContext('2d');
    x.fillStyle='#1f48a8';rrect(x,0,0,320,440,34);x.fill();x.lineWidth=12;x.strokeStyle='#050813';rrect(x,6,6,308,428,30);x.stroke();
    x.strokeStyle='#a9bdf0';x.lineWidth=4;x.setLineDash([12,10]);rrect(x,26,26,268,388,22);x.stroke();x.setLineDash([]);
    x.fillStyle='#ffffff';x.font='700 190px Fredoka,system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('?',160,215);
    x.font='700 30px Fredoka,system-ui,sans-serif';x.fillStyle='#c9d4f5';x.fillText('JourKnows',160,380);
    return new THREE.CanvasTexture(c);
  })();
  specs.forEach((spec,i)=>{
    const g=new THREE.Group();
    const body=mk(BOX,'#ffffff',1.03);body.scale.set(1.8,.14,2.4);g.add(body);body.userData.i=i;
    const front=new THREE.Mesh(new THREE.PlaneGeometry(1.6,2.2),new THREE.MeshBasicMaterial({map:faceTex(spec)}));front.rotation.x=-Math.PI/2;front.position.y=.075;g.add(front);
    const back=new THREE.Mesh(new THREE.PlaneGeometry(1.6,2.2),new THREE.MeshBasicMaterial({map:backTex}));back.rotation.x=Math.PI/2;back.position.y=-.075;g.add(back);
    g.rotation.z=Math.PI;scene.add(g);

  });
  if(document.fonts&&document.fonts.load)document.fonts.load('700 40px Fredoka').then(()=>specs.forEach(s=>s.redraw())).catch(()=>{});
  let cols=4,rows=3,running=false,over=false,lock=false,moves=0,time=0,matched=0,flipped=[],hov=-1;
  const pops=[],found=[];
  const rc=new THREE.Raycaster();
  function layout(){
    const asp=innerWidth/innerHeight;cam.aspect=asp;cam.updateProjectionMatrix();
    cols=asp<1?3:4;rows=12/cols;
    const sx=2.15,sz=2.75;
    cards.forEach((c,i)=>{const cx=i%cols,cz=Math.floor(i/cols);c.pos.set((cx-(cols-1)/2)*sx,0,(cz-(rows-1)/2)*sz+.6);c.g.position.x=c.pos.x;c.g.position.z=c.pos.z;});
    const gw=cols*sx+.6,gh=rows*sz+.8,t=Math.tan(22.5*Math.PI/180);
    const dist=Math.max(gh/2/t*1.18,gw/2/(t*asp)*1.08)+2;
    cam.position.set(0,dist*.9,dist*.5+.6);cam.lookAt(0,0,.5);
  }
  function hud(){UI.mid(`${moves} moves · ${fmt(time)}`);}
  function flipUp(c){c.tf=1;SND.flip();}
  function check(){
    const [a,b]=flipped;moves++;hud();lock=true;
    if(a.spec.sp===b.spec.sp){
      setTimeout(()=>{
        a.matched=b.matched=true;matched++;flipped=[];lock=false;
        const jc=a.spec.kind==='j'?a:b;
        const m=cloneJourn(a.spec.sp.id);m.scale.setScalar(.01);m.position.set(jc.pos.x,.2,jc.pos.z);scene.add(m);pops.push({m,t:0,x:jc.pos.x,z:jc.pos.z});
        fx.burst(new THREE.Vector3(jc.pos.x,.8,jc.pos.z),20);SND.ok();buzz(25);
        const st=storyOf(a.spec.sp);found.push(st);

    }
  }
  function end(){
    over=true;running=false;
    const score=Math.max(100,1500-moves*40-Math.floor(time)*4),st=moves<=9?3:moves<=14?2:1;

    resize(){layout();},
    start(){running=true;UI.score(0);UI.hearts(0,0);hud();UI.prompt('Memory match','Match each Journ with its topic.','Flip two cards at a time. Every match unlocks its story.');setTimeout(()=>{if(running)$('#prompt').hidden=true;},3500);},
    update(dt,t){
      if(running&&!over){time+=dt;if(Math.floor(time)!==Math.floor(time-dt))hud();}
      cards.forEach(c=>{
        c.f+=(c.tf-c.f)*Math.min(1,dt*11);
        const hv=(hov===c.i&&!c.matched&&!c.tf)?1:0;c.hover+=(hv-c.hover)*Math.min(1,dt*14);
        c.g.rotation.z=Math.PI*(1-c.f);
        c.g.position.y=Math.sin(Math.min(1,c.f)*Math.PI)*1.1+c.hover*.25;
        const s=1+c.hover*.05+(c.matched?Math.sin(t*3+c.i)*.01:0);c.g.scale.set(s,1,s);
      });
      for(const p of pops){
        p.t+=dt;const k=Math.min(1,p.t*2.5);

        p.m.position.set(p.x,.3,p.z);
        animJourn(p.m,t,p.x,.35,7);p.m.rotation.y=Math.sin(t*2+p.x)*.5;
      }
      fx.update(dt);
    },
    pointer(type,x,y){
      if(type!=='down'&&type!=='move')return;
      rc.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),cam);
      const h=rc.intersectObjects(cards.map(c=>c.body),false)[0];
      const i=h?h.object.userData.i:-1;
      if(type==='move'){hov=i;canvas.style.cursor=i>=0&&!cards[i].matched?'pointer':'default';return;}
      if(!running||over||lock||i<0)return;
      const c=cards[i];if(c.matched||c.tf||flipped.length>=2)return;
      flipUp(c);flipped.push(c);buzz(10);
      if(flipped.length===2)check();
    },
    dispose(){canvas.style.cursor='default';}
  };
}

/* ---------- Game 3: Whack-a-Journ (3D whack-a-mole with topic tags) ---------- */
function mkWhack(){
  const scene=new THREE.Scene();scene.background=skyTex('#0a2260','#6f8fe6');scene.fog=new THREE.Fog(0x6f8fe6,30,60);lights(scene);

  }

    const mound=mk(CYL,'#1f48a8',1.04);mound.scale.set(1.75,.3,1.75);mound.position.y=.15;g.add(mound);
    const disc=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,.04,24),toon('#050813'));disc.position.y=.31;g.add(disc);
    const rim=new THREE.Mesh(new THREE.TorusGeometry(1.15,.17,10,24),toon('#6f8fe6'));rim.rotation.x=Math.PI/2;rim.position.y=.33;const rl=new THREE.Mesh(rim.geometry,OUT);rl.scale.setScalar(1.12);rim.add(rl);g.add(rim);
    const hit=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,3.4,12),hitMat);hit.position.y=1.7;hit.userData.i=i;g.add(hit);
    const tc=tagCanvas(),tt=new THREE.CanvasTexture(tc);
    const tag=new THREE.Sprite(new THREE.SpriteMaterial({map:tt,depthTest:false,transparent:true}));tag.scale.set(2.7,.99,1);tag.renderOrder=10;tag.visible=false;g.add(tag);
    holes.push({i,x,z,g,hit,model:null,sp:null,ph:'idle',t:0,dur:0,target:false,tag,tagCtx:tc.getContext('2d'),tagTex:tt});
  }
  /* mallet */
  const mal=new THREE.Group();mal.add(cyl('#ffffff',0,1.15,0,.17,2.3,1.15));
  const head=mk(CYL,'#0a2260',1.1);head.rotation.z=Math.PI/2;head.scale.set(.62,1.1,.62);mal.add(head);
  mal.visible=false;scene.add(mal);
  const M={t:-1,x:0,z:0};
  const rc=new THREE.Raycaster();
  let running=false,over=false,score=0,streak=0,hearts=3,left=60,elapsed=0,spawnT=.6,q=null;
  const deck=[],answered=[];
  function nextQ(){
    if(!deck.length)deck.push(...shuffle(STORIES));
    q=deck.pop();
    UI.prompt('Which topic fits this story?',q.title,q.stat+' · '+q.label);
    holes.forEach(h=>{if(h.sp)h.target=h.sp.type===q.sp.type;});
  }
  function spawn(){
    const free=holes.filter(h=>h.ph==='idle');if(!free.length)return;
    const h=pick(free),needT=!holes.some(x=>x.ph==='up'&&x.target);
    const sp=(needT||Math.random()<.34)?q.sp:pick(SP.filter(s=>s!==q.sp));

  function end(){
    if(over)return;over=true;running=false;
    const st=score>=1200?3:score>=600?2:score>=200?1:0;
    setTimeout(()=>finish('whack',{title:hearts<=0?'Out of hearts!':"Time's up!",score,stars:st,line:`${answered.length} stories matched`,stories:answered.length?answered:[q]}),700);
  }
  return{scene,cam,
    resize(){
      const asp=innerWidth/innerHeight;cam.aspect=asp;cam.updateProjectionMatrix();
      const d=asp<.8?19:asp<1.2?15:12.5;cam.position.set(0,d*.86,d*.62);cam.lookAt(0,.4,.8);
    },
    start(){running=true;nextQ();UI.hearts(3);UI.mid(fmt(left));},
    update(dt,t){
      if(running&&!over){
        elapsed+=dt;left-=dt;if(Math.floor(left)!==Math.floor(left+dt))UI.mid(fmt(Math.max(0,left)));
        if(left<=0)end();
        spawnT-=dt;
        const up=holes.filter(h=>h.ph==='up').length,cap=elapsed<20?2:elapsed<40?3:4;
        if(spawnT<=0&&up<cap){spawn();spawnT=Math.max(.5,1.0-elapsed*.006);}
      }
      for(const h of holes){
        if(h.ph==='idle')continue;h.t+=dt;
        const m=h.model;if(!m){h.ph='idle';continue;}
        if(h.ph==='up'){
          let k;if(h.t<.22)k=h.t/.22;else if(h.t<h.dur-.25)k=1;else if(h.t<h.dur)k=(h.dur-h.t)/.25;else{if(h.target&&running)streak=0;clear(h);continue;}
          k=ease(k);m.position.y=.3-2.8*(1-k);animJourn(m,t,h.i,.06,9);
          h.tag.position.set(0,.3+3.15*k+(k>=1?Math.sin(t*5+h.i)*.06:0),.4);h.tag.visible=k>.55;
        }else if(h.ph==='hit'){
          if(h.t<.35){m.scale.set(.78*1.25,.78*.45,.78*1.25);m.position.y=.3-.9*(h.t/.35);h.tag.visible=false;}
          else clear(h);
        }
      }
      if(M.t>=0){
        M.t+=dt;const k=Math.min(1,M.t/.1);
        mal.position.set(M.x,4.8-2.7*ease(k),M.z);mal.rotation.x=.9*(1-k);
        if(M.t>.42){mal.visible=false;M.t=-1;}
      }
      fx.update(dt);
    },
    pointer(type,x,y){
      if(type!=='down')return;
      rc.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),cam);
      const hit=rc.intersectObjects(holes.map(h=>h.hit),false)[0];
      if(!hit)return;
      /* prefer the visible Journ nearest the camera when ray crosses two hit volumes */
      whack(holes[hit.object.userData.i]);
    },
    dispose(){}
  };
}

function tagSprite(text,bg='#ffffff',fg='#050813',sw=2.7){
  const c=document.createElement('canvas');c.width=300;c.height=110;const x=c.getContext('2d');
  x.fillStyle=bg;rrect(x,6,6,288,98,38);x.fill();x.lineWidth=8;x.strokeStyle='#050813';x.stroke();
  let fs=44;x.font=`700 ${fs}px Fredoka,system-ui,sans-serif`;
  while(x.measureText(text).width>250&&fs>20){fs-=3;x.font=`700 ${fs}px Fredoka,system-ui,sans-serif`;}
  x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';x.fillText(text,150,58);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
  s.scale.set(sw,sw*110/300,1);s.renderOrder=10;return s;
}
const hitRay=new THREE.Raycaster();
const ndc=(x,y)=>new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1);

/* ---------- Game 4: Stat Stack (3D timing tower) ---------- */
function mkStack(){
  const scene=new THREE.Scene();scene.background=skyTex('#0a2260','#a9bdf0');lights(scene);
  const cam=new THREE.OrthographicCamera(-1,1,1,-1,.1,200),fx=new FX(scene);
  const H=.6,COLS=['#1f48a8','#6f8fe6','#0a2260','#a9bdf0','#2a4fae','#c9d4f5'];
  const base=mk(BOX,'#050813',0);base.scale.set(5,1,5);base.position.y=-.5;scene.add(base);
  const block=(x,y,z,w,d,i)=>{const b=mk(BOX,COLS[i%COLS.length],1.03);b.scale.set(w,H,d);b.position.set(x,y,z);scene.add(b);return b;};
  block(0,H/2,0,3,3,0);
  const stack=[{x:0,z:0,w:3,d:3}],falls=[],seen=[],deck=shuffle(STORIES);
  let lv=0,cur=null,running=false,over=false,score=0,combo=0,camY=0,asp=1;
  function spawn(){
    lv++;const p=stack[stack.length-1],ax=lv%2?'x':'z';
    cur={ax,p,w:p.w,d:p.d,t:-Math.PI/2,m:block(p.x,lv*H+H/2,p.z,p.w,p.d,lv)};
  }
  function drop(){
    if(!running||over||!cur)return;
    const{p,ax,m}=cur,od=ax==='x'?'z':'x',sz=ax==='x'?'w':'d';
    const off=m.position[ax]-p[ax],S=cur[sz],ov=S-Math.abs(off);
    if(ov<=0){falls.push({m,v:0});cur=null;SND.hit();buzz(60);end();return;}
    const perfect=Math.abs(off)<.16;let pos=p[ax],ns=S;
    if(perfect){combo++;fx.burst(new THREE.Vector3(m.position.x,lv*H+.3,m.position.z),14);SND.ok();}
    else{
      combo=0;ns=ov;pos=p[ax]+off/2;
      const oh=block(m.position.x,lv*H+H/2,m.position.z,cur.w,cur.d,lv);
      oh.scale[ax]=Math.abs(off);oh.position[ax]=m.position[ax]+Math.sign(off)*(S/2-Math.abs(off)/2);
      falls.push({m:oh,v:0});SND.pop();
    }
    m.scale[ax]=ns;m.position[ax]=pos;m.position[od]=p[od];
    const e={x:m.position.x,z:m.position.z,w:ax==='x'?ns:cur.w,d:ax==='z'?ns:cur.d};stack.push(e);
    const pts=10+(perfect?15*Math.min(combo,5):0);score+=pts;UI.score(score);UI.mid(lv+' blocks');
    const[sx,sy]=scr(new THREE.Vector3(e.x,lv*H+1,e.z),cam);UI.pop(perfect?'Perfect! +'+pts:'+'+pts,sx,sy);
    if(lv%3===0){const s=deck[seen.length%deck.length];seen.push(s);UI.learn(`<b>${esc(s.sp.type)}: ${esc(s.stat)}</b>${esc(s.title)}`,3200);}
    spawn();
  }
  function end(){
    over=true;running=false;const h=stack.length-1,st=h>=12?3:h>=7?2:h>=3?1:0;
    setTimeout(()=>finish('stack',{title:'Tower down!',score,stars:st,line:`${h} blocks high`,stories:seen.length?seen:[deck[0]]}),900);
  }
  return{scene,cam,
    resize(){asp=innerWidth/innerHeight;const h=asp<1?22:12;cam.left=-h*asp/2;cam.right=h*asp/2;cam.top=h/2;cam.bottom=-h/2;cam.updateProjectionMatrix();},
    start(){running=true;spawn();UI.mid('0 blocks');UI.prompt('Stat Stack','Tap to drop the block.','Line it up. Perfect drops keep the tower wide. Every 3 blocks unlocks a story.');setTimeout(()=>{if(running)$('#prompt').hidden=true;},3800);},
    update(dt,t){
      if(cur&&running){cur.t+=dt*(2.1+Math.min(lv,30)*.08);cur.m.position[cur.ax]=cur.p[cur.ax]+Math.sin(cur.t)*3.4;}
      for(let i=falls.length-1;i>=0;i--){const f=falls[i];f.v+=dt*22;f.m.position.y-=f.v*dt;f.m.rotation.z+=dt*1.5;if(f.m.position.y<camY-14){scene.remove(f.m);falls.splice(i,1);}}
      camY+=((stack.length-1)*H-camY)*Math.min(1,dt*3);
      cam.position.set(9,camY+9,9);cam.lookAt(0,camY+1.2,0);fx.update(dt);
    },
    pointer(type){if(type==='down')drop();},
    key(e){if(e.code==='Space'||e.key==='Enter'){e.preventDefault();drop();}},
    dispose(){}
  };
}

/* ---------- Game 5: Stat Pop (3D bubble pop) ---------- */
function mkPop(){
  const scene=new THREE.Scene();scene.background=skyTex('#14307a','#a9bdf0');lights(scene);
  const cam=new THREE.PerspectiveCamera(50,1,.1,100),fx=new FX(scene);cam.position.set(0,0,14);
  const NR=8,deck=shuffle(STORIES),seen=[],BC=['#6f8fe6','#1f48a8','#a9bdf0','#2a4fae'];
  let W=3,running=false,over=false,score=0,streak=0,hearts=3,round=0,correct=0,bub=[],q=null,wait=0;
  const clearB=()=>{bub.forEach(b=>scene.remove(b.g));bub=[];};
  function nextRound(){
    if(round>=NR){end();return;}
    clearB();q=deck[round];round++;
    const opts=shuffle([q,...shuffle(STORIES.filter(s=>s!==q)).slice(0,3)]),cs=shuffle([-1,0,1]);cs.push(cs[0]);
    opts.forEach((s,i)=>{
      const g=new THREE.Group();g.add(sph(BC[i],0,0,0,1.25,1.25,1.25,1.07));g.add(sph('#ffffff',-.5,.6,1,.3,.2,.15,0));
      const tg=tagSprite(s.stat);tg.position.set(0,0,1.4);g.add(tg);
      g.position.set(cs[i]*W,-7-i*2.8,0);scene.add(g);
      bub.push({g,s,ok:s===q,bx:cs[i]*W,ph:rnd(0,6),v:2.2+round*.15});
    });
    UI.prompt(`Round ${round} of ${NR} · Which number fits?`,q.title,q.label);
  }
  function lose(msg,x,y){streak=0;hearts--;UI.hearts(hearts);SND.bad();buzz([60,40,60]);UI.pop(msg,x,y,'bad');if(hearts<=0)end();}
  function end(){
    if(over)return;over=true;running=false;const st=correct>=7?3:correct>=5?2:correct>=3?1:0;
    setTimeout(()=>finish('pop',{title:hearts<=0?'Out of hearts!':'Round complete!',score,stars:st,line:`${correct} of ${NR} stats popped`,stories:seen.length?seen:[q||deck[0]]}),700);
  }
  return{scene,cam,
    resize(){const a=innerWidth/innerHeight;cam.aspect=a;cam.updateProjectionMatrix();W=clamp(6.53*a-1.55,1.2,4.2);},
    start(){running=true;UI.hearts(3);UI.mid('');nextRound();},
    update(dt,t){
      if(wait>0){wait-=dt;if(wait<=0&&!over)nextRound();}
      else if(running&&!over)for(const b of bub.slice()){
        b.g.position.y+=b.v*dt;b.g.position.x=b.bx+Math.sin(t*1.8+b.ph)*.35;
        if(b.g.position.y>8){
          scene.remove(b.g);bub=bub.filter(x=>x!==b);
          if(b.ok){const[x,y]=scr(new THREE.Vector3(0,5,0),cam);lose('Too slow',x,y);UI.learn(`<b>It was ${esc(q.stat)}</b>${esc(q.label)}`,3000);seen.push(q);clearB();wait=.9;}
        }
      }
      fx.update(dt);
    },
    pointer(type,x,y){
      if(type!=='down'||!running||over||wait>0)return;
      hitRay.setFromCamera(ndc(x,y),cam);
      const h=hitRay.intersectObjects(bub.map(b=>b.g),true)[0];if(!h)return;
      const b=bub.find(k=>{let o=h.object;while(o){if(o===k.g)return true;o=o.parent;}return false;});if(!b)return;
      const[px,py]=scr(b.g.position,cam);fx.burst(b.g.position.clone(),b.ok?22:10,b.ok?undefined:['#050813','#6f8fe6']);
      scene.remove(b.g);bub=bub.filter(k=>k!==b);
      if(b.ok){
        streak++;correct++;const pts=100+Math.min(streak,6)*20;score+=pts;UI.score(score);SND.ok();buzz(30);UI.pop('+'+pts,px,py);
        seen.push(q);UI.learn(`<b>${esc(q.sp.type)}: ${esc(q.stat)}</b>${esc(q.label)}`,3000);clearB();wait=.8;
      }else{SND.pop();lose('Not that one',px,py);}
    },
    dispose(){}
  };
}

/* ---------- Game 6: Fact Flap (3D flappy gates) ---------- */
function mkFlap(){
  const scene=new THREE.Scene();scene.background=skyTex('#5f82dc','#eef2ff');scene.fog=new THREE.Fog(0xdfe6fa,40,110);lights(scene);
  const cam=new THREE.PerspectiveCamera(50,1,.1,200),fx=new FX(scene);
  const NG=8,GAP=20,FIRST=22,FL=-7.2,CE=7.2,SEG=[[FL-2,-4.3],[-.9,.9],[4.3,CE+2]];
  for(const y of[FL-1,CE+1]){const b=mk(BOX,'#14307a',0);b.scale.set(300,2,30);b.position.set(0,y,-8);scene.add(b);}
  const bg=[];for(let i=0;i<12;i++){const h=rnd(4,12),b=mk(BOX,pick(['#6f8fe6','#a9bdf0','#1f48a8','#c9d4f5']),1.02);b.scale.set(rnd(3,5),h,3);b.userData={x:i*9};b.position.set(0,FL+h/2,-14);scene.add(b);bg.push(b);}
  const facts=STORIES.filter(s=>s.ans),fics=STORIES.filter(s=>!s.ans);
  const claims=shuffle([...shuffle(facts).slice(0,3),...shuffle(fics).slice(0,NG-3)]);
  const gates=claims.map((cl,i)=>{
    const g=new THREE.Group(),factUp=Math.random()<.5;
    SEG.forEach(([a,b])=>{const s=mk(BOX,'#0a2260',1.04);s.scale.set(1.4,b-a,1.4);s.position.y=(a+b)/2;g.add(s);});
    [[2.6,factUp],[-2.6,!factUp]].forEach(([y,f])=>{
      const pl=new THREE.Mesh(new THREE.PlaneGeometry(1.4,3.4),new THREE.MeshBasicMaterial({color:f?0xeef2ff:0x050813,transparent:true,opacity:.55}));pl.position.set(0,y,-.8);g.add(pl);
      const tg=tagSprite(f?'FACT':'FICTION',f?'#ffffff':'#050813',f?'#050813':'#ffffff',2.3);tg.position.set(-2.4,y,.5);g.add(tg);
    });
    scene.add(g);return{d:FIRST+i*GAP,claim:cl,factUp,g,done:false};
  });
  const pl=cloneJourn(S.pick);pl.scale.setScalar(.8);pl.rotation.order='ZYX';pl.rotation.y=Math.PI/2;scene.add(pl);
  const ST={dist:0,py:0,vy:0,hearts:3,score:0,streak:0,correct:0,resolved:0,inv:0,over:false,shake:0};
  let running=false,live=false,cx=3,cz=18;
  const flap=()=>{if(!running||ST.over)return;live=true;ST.vy=9.5;sfx(520,'sine',.07,.06,820);};
  function setPrompt(){const g=gates.find(x=>!x.done);if(g)UI.prompt(`Claim ${gates.indexOf(g)+1} of ${NG} · Fact or fiction?`,g.claim.claim,'Tap or press Space to flap. Fly through the FACT or FICTION opening.');}
  function hurt(msg){
    ST.hearts--;ST.inv=1.3;ST.streak=0;ST.shake=REDUCED?0:.5;UI.hearts(ST.hearts);SND.bad();buzz([60,40,60]);
    const[x,y]=scr(new THREE.Vector3(0,ST.py+1.5,0),cam);UI.pop(msg,x,y,'bad');if(ST.hearts<=0)end();
  }
  function resolve(g){
    g.done=true;ST.resolved++;const ok=((ST.py>0)===g.factUp)===g.claim.ans;
    const[x,y]=scr(new THREE.Vector3(0,ST.py+1.5,0),cam);
    if(ok){ST.streak++;ST.correct++;const pts=100+Math.min(ST.streak,5)*10;ST.score+=pts;fx.burst(new THREE.Vector3(0,ST.py,0),20);SND.ok();buzz(25);UI.pop('+'+pts,x,y);}
    else hurt('Not quite');
    UI.score(ST.score);
    UI.learn(`<b>${ok?'Correct':'Not quite'}: this one is ${g.claim.ans?'a fact':'fiction'}.</b>${esc(g.claim.why)}`,3600);
    if(ST.over)return;
    if(ST.resolved>=NG)setTimeout(end,1300);else setPrompt();
  }
  function end(){
    if(ST.over)return;ST.over=true;running=false;const st=ST.correct>=7?3:ST.correct>=5?2:ST.correct>=3?1:0;
    setTimeout(()=>finish('flap',{title:ST.hearts<=0?'Out of hearts!':'Finish line!',score:ST.score,stars:st,line:`${ST.correct} of ${NG} claims right`,stories:claims.slice(0,Math.max(1,ST.resolved))}),900);
  }
  return{scene,cam,
    resize(){const a=innerWidth/innerHeight;cam.aspect=a;cam.updateProjectionMatrix();cx=a<1?1.8:3.2;cz=a<1?26:18;},
    start(){running=true;UI.hearts(3);UI.mid('');setPrompt();},
    update(dt,t){
      if(running&&live&&!ST.over){
        ST.dist+=(5.2+.25*ST.resolved)*dt;ST.vy-=26*dt;ST.py+=ST.vy*dt;
        if(ST.py<FL+.8){ST.py=FL+.8;ST.vy=Math.max(ST.vy,0);}
        if(ST.py>CE-.8){ST.py=CE-.8;ST.vy=Math.min(ST.vy,0);}
      }
      ST.inv=Math.max(0,ST.inv-dt);
      for(const g of gates){
        const x=g.d-ST.dist;g.g.position.x=x;
        if(!running||ST.over||g.done)continue;
        if(ST.inv<=0&&Math.abs(x)<1.25&&SEG.some(([a,b])=>ST.py+.6>a&&ST.py-.6<b))hurt('Ouch!');
        if(ST.over)break;
        if(x<-.6)resolve(g);
      }
      for(const b of bg)b.position.x=(((b.userData.x-ST.dist*.5)%108)+108)%108-40;
      pl.position.set(0,ST.py-.8,0);animJourn(pl,t,0,.12,12);pl.rotation.z=clamp(ST.vy*.035,-.6,.6);
      pl.visible=ST.inv<=0||Math.floor(t*14)%2===0;
      ST.shake=Math.max(0,ST.shake-dt*1.6);const sh=ST.shake*.3;
      cam.position.set(cx+rnd(-sh,sh),.5+rnd(-sh,sh),cz);cam.lookAt(cx,0,0);fx.update(dt);
    },
    pointer(type){if(type==='down')flap();},
    key(e){if(e.code==='Space'||e.key==='ArrowUp'||e.key==='w'||e.key==='W'){e.preventDefault();flap();}},
    dispose(){}
  };
}

let cur=null,curKey=null,hubScene=null;
function freeScene(sc){
  if(!sc||sc===hubScene)return;
  sc.traverse(o=>{const ms=o.material?(Array.isArray(o.material)?o.material:[o.material]):[];
    ms.forEach(m=>{if(m===OUT)return;if(m.map&&m.map!==GRAD)m.map.dispose();if(m.isSpriteMaterial||m.isMeshBasicMaterial||m.isPointsMaterial)m.dispose();});});
  if(sc.background&&sc.background.dispose)sc.background.dispose();
}
function setScene(o){if(cur&&cur.dispose)cur.dispose();if(cur)freeScene(cur.scene);cur=o;o.resize();}
function modal(html){$('#mCard').innerHTML=html;$('#modal').hidden=false;const b=$('#mCard button');if(b)b.focus({preventScroll:true});}
function closeModal(){$('#modal').hidden=true;}
function renderHub(){
  $('#games').innerHTML=Object.entries(GAMES).map(([k,g])=>`<button class="gcard" data-g="${k}"><img alt="" src="${uri(SP[g.icon])}"><div><h3 class="display">${g.title}</h3><p>${g.desc}</p><small>Best: ${S.best[k]||0}</small></div></button>`).join('');
  $('#games').querySelectorAll('.gcard').forEach(b=>b.addEventListener('click',()=>openGame(b.dataset.g)));
  $('#pickRow').innerHTML=SP.map(s=>`<button data-id="${s.id}" aria-pressed="${s.id===S.pick}" aria-label="${s.name}"><img alt="" src="${uri(s)}"></button>`).join('');
  $('#pickRow').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.pick=+b.dataset.id;saveS();SND.pop();renderHub();}));
  $('#foot').textContent=`Stories are short summaries compiled from published reports as of ${EDITION.asOf} (${EDITION.label} edition). Details change quickly, so follow the linked sources.`;
}
function showHub(){
  closeModal();UI.show(false);curKey=null;
  hubScene=hubScene||mkHub();setScene(hubScene);
  $('#hub').hidden=false;renderHub();
}
function openGame(key){
  closeModal();$('#hub').hidden=true;curKey=key;
  const g=GAMES[key],sc=g.make();setScene(sc);
  UI.show(true);UI.score(0);UI.mid('');UI.hearts(0,0);
  modal(`<h2 class="display">${g.title}</h2><p>${g.desc}</p><div class="how"><ul>${g.how.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="btns"><button class="cbtn navy" id="mPlay">Play</button><button class="cbtn" id="mBack">Back to arcade</button></div>`);

function finish(key,r){
  SND.win();
  const prev=S.best[key]||0,nb=r.score>prev;if(nb){S.best[key]=r.score;saveS();}
  $('#prompt').hidden=true;$('#learn').hidden=true;
  const seen=[...new Set(r.stories)];
  modal(`<h2 class="display">${esc(r.title)}</h2>${stars(r.stars)}<p class="big display">${r.score}</p><p>${esc(r.line)} · ${nb?'New best!':'Best '+prev}</p>
  <div class="slist"><h4>Stories from this round</h4>${seen.map(s=>`<a class="stItem" href="${esc(s.src.url)}" target="_blank" rel="noopener noreferrer"><img alt="" src="${uri(s.sp)}"><span><b>${esc(s.title)}</b><small>${esc(s.stat)} · ${esc(s.src.name)}</small></span><i>↗</i></a>`).join('')}</div>
  <p class="disc">Compiled from published reports as of ${EDITION.asOf}. Follow the links for full and current reporting.</p>
  <div class="btns"><button class="cbtn navy" id="mAgain">Play again</button><button class="cbtn" id="mHub">Back to arcade</button></div>`);
  $('#mAgain').addEventListener('click',()=>openGame(key));
  $('#mHub').addEventListener('click',showHub);
}

/* input */
canvas.addEventListener('pointerdown',e=>{if(cur&&cur.pointer)cur.pointer('down',e.clientX,e.clientY,e);});
canvas.addEventListener('pointermove',e=>{if(cur&&cur.pointer&&e.pointerType==='mouse')cur.pointer('move',e.clientX,e.clientY,e);});
canvas.addEventListener('pointerup',e=>{if(cur&&cur.pointer)cur.pointer('up',e.clientX,e.clientY,e);});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&curKey&&$('#modal').hidden){showHub();return;}
  if(!$('#modal').hidden)return;
  if(cur&&cur.key){if(/^Arrow/.test(e.key))e.preventDefault();cur.key(e);}
});
$('#hBack').addEventListener('click',showHub);
function muteUI(){$('#hMute').textContent=S.mute?'✕':'♪';$('#hMute').setAttribute('aria-pressed',S.mute);}
$('#hMute').addEventListener('click',()=>{S.mute=!S.mute;saveS();muteUI();});
muteUI();

/* loop */
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  renderer.setPixelRatio(dpr);renderer.setSize(innerWidth,innerHeight,false);
  if(cur)cur.resize();
}
window.addEventListener('resize',resize);
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(cur&&!document.hidden){cur.update(dt,now/1000);renderer.render(cur.scene,cur.cam);}
  requestAnimationFrame(frame);
}
renderer.setSize(innerWidth,innerHeight,false);renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
showHub();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
